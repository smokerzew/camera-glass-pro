# Builds and tests Camera Glass Pro on a GitHub-hosted Mac and uploads an UNSIGNED .ipa.
# An unsigned .ipa does not install on its own: sign it with Xcode, or with a tool such as
# Sideloadly/AltStore using your own Apple ID (see README > "Installing from Windows").
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # lets the job publish the .ipa as a release file (public, no sign-in to download)

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail # a failing test must fail the job even though output goes through tee
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project CameraGlassPro.xcodeproj \
            -scheme CameraGlassPro \
            -destination "id=$SIM_ID" \
            -resultBundlePath TestResults.xcresult 2>&1 | tee test.log

      - name: Surface test and compile errors as annotations
        if: failure()
        run: |
          # Annotations are readable without signing in, unlike raw logs.
          grep -E "error:|: failed|XCTAssert|Fatal error|Testing failed" test.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -project CameraGlassPro.xcodeproj \
            -scheme CameraGlassPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CameraGlassPro.app Payload/
          zip -qry CameraGlassPro-unsigned.ipa Payload
          ls -lh CameraGlassPro-unsigned.ipa

      - name: Publish .ipa to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CameraGlassPro-unsigned.ipa             --title "Latest build" --notes "Unsigned build of ${GITHUB_SHA::7}" --latest

      - uses: actions/upload-artifact@v4
        with:
          name: CameraGlassPro-unsigned-ipa
          path: CameraGlassPro-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
